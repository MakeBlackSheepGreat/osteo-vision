# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^(research/(datasets|model-snapshots|reports/(archive|legacy|modeling|preprocessing))/|docs/archive/|scripts/archive/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML
      - id: check-json
        name: Check JSON
      - id: check-added-large-files
        name: Check for added large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: check-ast
        name: Check Python AST

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Black (code formatter)
        language_version: python3
        files: ^(src|backend|app|scripts|tools|tests)/.*\.py$
        args: ['--line-length=120']

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        name: isort (import sorter)
        files: ^(src|backend|app|scripts|tools|tests)/.*\.py$
        args: ["--profile", "black", "--line-length", "120"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: Ruff (linter)
        files: ^(src|backend|app|scripts|tools|tests)/.*\.py$
        args: ['--fix']

  - repo: local
    hooks:
      - id: mypy
        name: Mypy (project environment)
        entry: python tools/run_project_mypy.py src backend --config-file=pyproject.toml --hide-error-context --no-error-summary
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-check
        name: Run core and backend regression tests
        entry: python -m pytest tests/unit tests/smoke backend/tests -x -q
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
      - id: active-documentation-audit
        name: Audit current documentation and versions
        entry: python tools/run_project_audit.py
        language: system
        pass_filenames: false
        always_run: true
