[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osteo-vision"
version = "0.3.0rc2"
description = "颌骨骨髓炎术中荧光辅助决策研发验证版平台"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Osteo Vision Team"}
]
keywords = ["medical-imaging", "osteomyelitis", "fluorescence", "platform", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["osteo_vision_core*", "backend*"]
exclude = ["backend.tests*", "tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | scripts/archive
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["osteo_vision_core", "backend"]
known_third_party = ["pytest", "numpy", "torch", "yaml"]
default_section = "THIRDPARTY"
skip_glob = ["scripts/archive/**"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
follow_imports = "normal"
ignore_missing_imports = false
exclude = ["^tests/", "^backend/tests/"]

[[tool.mypy.overrides]]
module = ["osteo_vision_core.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "numpy.*",
    "torch.*",
    "skimage.*",
    "sklearn.*",
    "PIL.*",
    "cv2.*",
    "scipy.*",
    "psutil.*",
    "pydicom.*",
    "nibabel.*",
    "monai.*",
    "nnunet.*",
    "timm.*",
    "open_clip.*",
    "gradio.*",
    "yaml.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "smoke: marks tests as smoke tests",
]

[tool.coverage.run]
source = ["osteo_vision_core"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionErrorError",
    "raise NotImplementedError",
    "if 0:",
    "if TYPE_CHECKING:",
]
