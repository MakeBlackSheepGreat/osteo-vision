paths_config: configs/paths.example.yml
runtime:
  runtime_profile: development
  strict_startup: false
  recommended_tools:
    - ffmpeg
    - ffprobe
  model_version: osteo-vision-convnext3d-proxy-v0
  framework_version: v2
  task_package: configs/tasks/osteo_vision.yml
  default_task_type: segmentation
  default_threshold: 0.6
  low_confidence_margin: 0.15
  device_policy: auto
  use_fixture_model: true
  checkpoint_path: artifacts/checkpoints/osteo_vision/d025_lesion_smoke.pt
  allow_fixture_on_missing_checkpoint: true
  model_selection_policy: fixture_fallback
  disclaimer: Platform software for research and engineering validation. This result is not a clinical diagnosis and must not replace physician review.
  models:
    - model_id: convnext3d_d025_proxy_segmenter
      family: convnext3d_segmenter
      task_types: [segmentation]
      input_types: [npz_roi]
      spatial_dims: [3]
      checkpoint_path: artifacts/checkpoints/osteo_vision/d025_lesion_smoke.pt
      source_url: local://d025-dolchid-cbct-lesion-roi-proxy-cache
      license: research
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: ConvNeXt-style 3D CBCT lesion ROI proxy segmentation for engineering validation
      clinical_claim_allowed: false
      extra:
        threshold: 0.2
        output_dir: artifacts/visual_evidence/osteo_vision/model_masks
        proxy_dataset: D025_DOLCHID_CBCT_lesion_roi_64
        architecture_note: tiny_3d_unet_with_convnext_style_depthwise_residual_blocks
    - model_id: fluorescence_hotspot_2d_segmenter
      family: fluorescence_hotspot_segmenter
      task_types: [segmentation]
      input_types: [2d_image]
      spatial_dims: [2]
      source_url: local://fluorescence-hotspot-threshold-baseline
      license: internal
      dependency_group: core
      device_policy: cpu
      precision: deterministic
      enabled: true
      intended_use: heuristic 2D fluorescence hotspot mask for JPEG/keyframe platform validation evidence
      clinical_claim_allowed: false
      extra:
        threshold: 0.6
        min_component_area: 25
        colormap: green
        alpha: 0.45
        output_dir: artifacts/visual_evidence/osteo_vision/hotspot_masks
    - model_id: convnext2d_keyframe_proxy_segmenter
      family: convnext2d_keyframe_segmenter
      task_types: [segmentation]
      input_types: [2d_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/checkpoints/osteo_vision/keyframe_convnext2d_proxy_grouped_20260710.pt
      source_url: local://d046-source-video-grouped-fluorescence-keyframe-proxy
      license: internal
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: trainable 2D JPEG/MP4 keyframe segmentation proxy for engineering validation
      clinical_claim_allowed: false
      extra:
        threshold: 0.45
        output_dir: artifacts/visual_evidence/osteo_vision/keyframe_model_masks
        input_domain: public_or_local_proxy_keyframe_non_target_domain
        target_domain: false
        training_data_boundary: synthetic_or_pseudo_labeled_non_target_domain
        video_signal_segmentation:
          enabled: true
          disease_final_mask_allowed: false
          output_keys: [bone_gate_mask, fluorescence_signal_mask, risk_mask, uncertain_mask]
          bone_gate_policy: not_available_pending_review_without_sam_or_physician_annotation
          risk_mask_method: fluorescence_signal_with_uncertainty_v1
          medical_boundary: fluorescence/perfusion risk prompt requiring physician review
        tile_size: 512
        tile_overlap: 64
        tile_batch_size: 4
        max_whole_pixels: 1048576
        evidence_png_compression: 1
        overlay_format: jpeg
        overlay_jpeg_quality: 90
        candidate_min_component_area: 64
        candidate_min_area_fraction: 0.00002
        candidate_max_count: 256
        temperature: 1.4138116836547852
        uncertainty_tta_enabled: true
        live_stream:
          uncertainty_tta_enabled: false
          max_whole_pixels: 1048576
          tile_batch_size: 8
          fast_output: true
          overlay_format: jpeg
          overlay_jpeg_quality: 82
          use_amp: true
        runtime_allowed: true
    - model_id: keyframe_residual_attention_unet_s20260715_20260715
      family: residual_attention_unet_keyframe_segmenter
      task_types: [segmentation]
      input_types: [2d_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/checkpoints/osteo_vision/keyframe_residual_attention_unet_s20260715_20260715.pt
      source_url: local://d046-layered-registry-fluorescence-keyframe-proxy
      license: internal
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: primary 2D JPEG/MP4 keyframe fluorescence-signal segmentation for engineering validation
      clinical_claim_allowed: false
      extra:
        runtime_allowed: true
        runtime_sidecar_path: artifacts/checkpoints/osteo_vision/keyframe_residual_attention_unet_s20260715_20260715_runtime_promotion.json
        checkpoint_model_id: keyframe_residual_attention_unet_s20260715_20260715
        threshold: 0.4
        output_dir: artifacts/visual_evidence/osteo_vision/keyframe_model_masks
        input_domain: public_or_synthetic_proxy_keyframe_non_target_domain
        target_domain: false
        training_data_boundary: admitted_proxy_rows_retain_non_target_domain_provenance
        video_signal_segmentation:
          enabled: true
          disease_final_mask_allowed: false
          output_keys: [bone_gate_mask, fluorescence_signal_mask, risk_mask, uncertain_mask]
          bone_gate_policy: not_available_pending_review_without_sam_or_physician_annotation
          risk_mask_method: fluorescence_signal_with_uncertainty_v1
          medical_boundary: fluorescence/perfusion risk prompt requiring physician review
        tile_size: 512
        tile_overlap: 64
        tile_batch_size: 4
        max_whole_pixels: 1048576
        uncertainty_tta_enabled: true
        live_stream:
          uncertainty_tta_enabled: false
          max_whole_pixels: 1048576
          tile_batch_size: 8
          fast_output: true
          overlay_format: jpeg
          overlay_jpeg_quality: 82
          use_amp: true
    - model_id: convnext2d_video_signal_multimask_v2_grouped
      family: video_signal_multimask
      task_types: [segmentation]
      input_types: [2d_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/checkpoints/osteo_vision/keyframe_video_signal_multimask_v2_grouped.pt
      source_url: local://d046-grouped-video-signal-multimask-proxy
      license: internal
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: optional fluorescence-signal and bone-gate multi-mask candidate for engineering validation
      clinical_claim_allowed: false
      extra:
        runtime_allowed: true
        candidate_only: true
        mainline_replacement_allowed: false
        checkpoint_runtime_allowed_at_training: false
        runtime_approval: optional_candidate_adapter_smoke
        input_shape: [128, 176]
        thresholds:
          fluorescence_signal: 0.35
          bone_gate: 0.35
        output_dir: artifacts/visual_evidence/osteo_vision/video_signal_multimask
        input_domain: public_fluorescence_proxy_and_prompt_assisted_bone_gate_seeds
        target_domain: false
        disease_final_mask_allowed: false
        bone_gate_policy: semi_automatic_seed_review_required
        review_states: [accepted, modified, rejected, review_required]
        review_weights:
          accepted: 4.0
          modified: 4.0
          rejected: 0.5
          review_required: 1.0
    - model_id: dual_channel_proxy_ablation_segmenter
      family: dual_channel_segmenter
      task_types: [segmentation]
      input_types: [dual_channel_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/checkpoints/osteo_vision/dual_channel_proxy_20260710.pt
      source_url: local://d046-dual-channel-proxy-ablation
      license: internal
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: white-light and fluorescence proxy fusion segmentation for engineering validation
      clinical_claim_allowed: false
      extra:
        threshold: 0.5
        mode: early_fusion
        output_dir: artifacts/visual_evidence/osteo_vision/dual_channel_ai
        runtime_allowed: false
        input_domain: public_non_target_domain_with_synthetic_white_light_proxy
        white_light_source: synthetic_white_light_proxy_derived_for_ablation
        target_domain: false
        fallback_policy: traditional_registration_and_fusion
    - model_id: patient_conditioned_kits23_proxy_candidate
      family: patient_conditioned_segmenter
      task_types: [segmentation]
      input_types: [dual_channel_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/patient_conditioned_kits23_proxy/training/patient_conditioned_manifest_proxy.pt
      source_url: local://d071-kits23-patient-conditioned-non-target-domain-proxy
      license: research
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: explicit patient-conditioned engineering evidence with mandatory image-only safety fallback
      clinical_claim_allowed: false
      extra:
        runtime_allowed: true
        candidate_only: true
        engineering_candidate_execution_allowed: true
        runtime_replacement_allowed: false
        mainline_replacement_allowed: false
        strict_promotion_authorized: false
        checkpoint_manifest_path: artifacts/patient_conditioned_kits23_proxy/training/patient_conditioned_manifest_proxy_manifest.json
        checkpoint_manifest_sha256: 27f1fe208cea184e0ee069ae16165b1d63cc766dcf8d291ebb3602d4cff4e1e3
        threshold: 0.05
        uncertainty_threshold: 0.5
        output_dir: artifacts/visual_evidence/osteo_vision/patient_conditioned_segmentation
        input_domain: kits23_abdominal_ct_public_proxy
        target_domain: false
        training_channel_semantics: non_fluorescence_ct_proxy
        safe_fallback: image_only_segmentation
    - model_id: bone_activity_multitask_d074_proxy_candidate
      family: bone_activity_multitask
      task_types: [segmentation, multitask]
      input_types: [dual_channel_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/bone_activity_d074_proxy/training/bone_activity_multitask_d074_proxy.pt
      source_url: https://zenodo.org/records/15260349
      license: CC-BY-4.0
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: checksum-bound bone-activity multitask checkpoint execution for engineering evidence
      clinical_claim_allowed: false
      extra:
        runtime_allowed: true
        candidate_only: true
        engineering_candidate_execution_allowed: true
        runtime_replacement_allowed: false
        mainline_replacement_allowed: false
        strict_promotion_authorized: false
        checkpoint_manifest_path: artifacts/bone_activity_d074_proxy/training/bone_activity_multitask_d074_proxy_manifest.json
        checkpoint_manifest_sha256: 50816b29384766fdc6b7dc23d7a04d523958343351b89ff6a1d2e7dc4f5d7a8f
        input_shape: [192, 256]
        output_dir: artifacts/visual_evidence/osteo_vision/bone_activity_multitask
        input_domain: human_brain_ppix_fluorescence_proxy
        target_domain: false
        engineering_utility_ready: false
        safe_fallback: all_spatial_candidates_unavailable
    - model_id: d025_lesion_smoke_segmenter
      family: d025_lesion_segmenter
      task_types: [segmentation]
      input_types: [npz_roi]
      spatial_dims: [3]
      checkpoint_path: artifacts/checkpoints/osteo_vision/d025_lesion_smoke.pt
      source_url: local://d025-dolchid-cbct-lesion-roi-proxy-cache
      license: research
      dependency_group: torch
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: engineering smoke model for CBCT lesion ROI proxy segmentation
      clinical_claim_allowed: false
      extra:
        threshold: 0.2
        output_dir: artifacts/visual_evidence/osteo_vision/model_masks
    - model_id: nnunet_v2_osteo_baseline
      family: nnunet_v2
      task_types: [segmentation]
      input_types: [dicom_series, nifti_volume, npz_roi]
      spatial_dims: [2, 3]
      checkpoint_path: artifacts/checkpoints/osteo_vision/nnunet_v2
      source_url: https://github.com/MIC-DKFZ/nnUNet
      license: Apache-2.0
      dependency_group: nnunet
      device_policy: auto
      precision: fp32
      enabled: true
      intended_use: jaw osteomyelitis segmentation baseline
      clinical_claim_allowed: false
    - model_id: medsam2_osteo_promptable
      family: medsam_like
      task_types: [segmentation]
      input_types: [2d_image, video_file, video_stream, npz_roi, dicom_series, nifti_volume]
      spatial_dims: [2, 3]
      checkpoint_path: artifacts/checkpoints/osteo_vision/medsam2.pt
      source_url: https://arxiv.org/html/2504.03600v1
      license: research
      dependency_group: sam
      device_policy: auto
      precision: fp16
      enabled: true
      intended_use: promptable lesion or necrotic bone ROI segmentation contract; fallback is not real MedSAM2 checkpoint inference
      clinical_claim_allowed: false
      extra:
        prompt_fallback_enabled: true
        point_radius_px: 12
        output_dir: artifacts/visual_evidence/osteo_vision/prompt_masks
    - model_id: biomedclip_osteo_screening
      family: vlm_encoder
      task_types: [classification]
      input_types: [2d_image]
      spatial_dims: [2]
      checkpoint_path: artifacts/checkpoints/osteo_vision/biomedclip.pt
      source_url: https://huggingface.co/microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
      license: MIT
      dependency_group: vlm
      device_policy: auto
      precision: fp16
      enabled: true
      intended_use: auxiliary image-level screening platform workflow
      clinical_claim_allowed: false
    - model_id: fixture_default
      family: fixture
      task_types: ['*']
      input_types: ['*']
      spatial_dims: [2, 3]
      source_url: local_fixture
      license: internal
      dependency_group: fixture
      device_policy: cpu
      precision: deterministic
      enabled: true
      intended_use: deterministic fallback for tests and demos
      clinical_claim_allowed: false
  tasks:
    classification:
      pipeline: classification
      class_labels:
        negative: viable_or_non_lesion
        positive: osteomyelitis_or_necrotic_bone
      risk_mapping:
        low: [0.0, 0.33]
        medium: [0.33, 0.66]
        high: [0.66, 1.0]
    segmentation:
      pipeline: segmentation
      model_id: keyframe_residual_attention_unet_s20260715_20260715
      mask_threshold: 0.5
      min_component_size: 50
    detection:
      pipeline: detection
      max_candidates: 5
    quantification:
      pipeline: quantification
    multitask:
      pipeline: multitask
      steps:
        - segmentation
        - quantification
        - classification
input:
  accepted_image_extensions: [.png, .jpg, .jpeg, .tif, .tiff]
  accepted_video_extensions: [.mp4]
  official_video_resolution: [3840, 2160]
  official_image_format: jpeg
  accepted_stream_schemes: [camera, rtsp, http, https]
  accepted_npz_extensions: [.npz]
  accepted_dicom_extensions: [.dcm]
  accepted_nifti_extensions: [.nii, .nii.gz]
  max_file_size_mb: 1000
reports:
  output_dir: artifacts/reports/osteo_vision
  visual_dir: artifacts/visual_evidence/osteo_vision
  generate_html: true
  generate_json: true
  generate_csv: true
benchmark:
  output_dir: artifacts/reports/osteo_vision/benchmark
  save_predictions: true
  save_metrics: true
  save_plots: true
