task_id: medical_competition_demo
task_name: Medical Imaging Competition Demo
modality: generic
input_contract:
  input_types: [2d_image, npz_roi, dicom_series, nifti_volume]
  required_manifest_columns: [case_id, input_path, label, task_type, input_type]
  optional_manifest_columns: [patient_id, split, fold, label_source, modality, metadata_path, mask_path, bbox, model_hint]
label_contract:
  type: binary_or_missing
  positive_label: 1
  negative_label: 0
pipelines: [classification, segmentation, detection, quantification, multitask]
metrics: [accuracy, sensitivity, specificity, precision, f1, dice, iou]
demo_outputs: [prediction, probability, class_label, risk_level, segmentation_mask, lesion_evidence, quantification, warnings, report_path]
benchmark_contract:
  manifest_version: v2
  patient_level_split_recommended: true
  threshold_analysis_required_when_labeled: true
recommended_models:
  - model_id: biomedclip_zero_shot
    family: vlm_encoder
  - model_id: medsam2_promptable
    family: medsam_like
  - model_id: vista3d_foundation
    family: vista3d_like
  - model_id: nnunet_v2_baseline
    family: nnunet_v2
  - model_id: monai_bundle_baseline
    family: monai_bundle
  - model_id: fixture_default
    family: fixture
safety:
  disclaimer_required: true
  clinical_claim_allowed: false
  user_upload_policy: transient_inference_only
