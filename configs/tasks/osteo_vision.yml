task_id: osteo_vision
task_name: Osteomyelitis Intelligent Fluorescence Diagnosis and Treatment
modality: generic
input_contract:
  input_types: [2d_image, video_file, video_stream, npz_roi, dicom_series, nifti_volume]
  official_device:
    source: official technical document
    image_resolution: 3840x2160
    image_format: jpeg
    video_format: mp4
    storage: USB3.0
  required_manifest_columns: [case_id, input_path, label, task_type, input_type]
  optional_manifest_columns:
    - patient_id
    - split
    - fold
    - label_source
    - modality
    - metadata_path
    - mask_path
    - signal_mask_path
    - fluorescence_signal_mask_path
    - bone_gate_mask_path
    - bone_gate_overlay_path
    - mask_type
    - review_state
    - sample_weight
    - prompt_source
    - white_light_path
    - fluorescence_path
    - video_path
    - stream_uri
    - frame_timestamp
    - frame_index
    - target_domain_flag
    - input_domain
    - review_priority
    - uncertainty_path
    - failure_reason
    - dicom_series_path
    - cbct_path
    - roi_path
    - device
    - device_resolution
    - acquisition_mode
    - acquisition_time
label_contract:
  type: binary_or_missing
  positive_label: osteomyelitis_or_necrotic_bone
  negative_label: viable_or_non_lesion
  mask_labels:
    background: 0
    lesion_or_necrotic_bone: 1
    uncertain_boundary: 2
  video_signal_segmentation:
    task_definition: exposed bone gate plus fluorescence/perfusion signal plus risk and uncertainty prompts
    disease_final_mask_allowed: false
    physician_review_required: true
    masks:
      exposed_bone:
        id: 10
        output_key: bone_gate_mask
        description: Exposed bone or suspected bone surface.
        label_source: physician_or_sam_assisted_review_required
      soft_tissue:
        id: 11
        output_key: soft_tissue_mask
        description: Surrounding soft tissue region.
        label_source: physician_or_sam_assisted_review_required
      instrument_or_occlusion:
        id: 12
        output_key: occlusion_mask
        description: Instrument, smoke, glare, or occlusion.
        label_source: quality_or_review_signal
      fluorescence_hotspot:
        id: 13
        output_key: fluorescence_signal_mask
        description: High fluorescence signal candidate.
        label_source: trainable_or_heuristic_proxy
      hypo_fluorescent_bone:
        id: 14
        output_key: hypo_fluorescent_bone_mask
        description: Weak fluorescence or low perfusion area within reviewed bone gate.
        label_source: requires_bone_gate_review
      boundary_risk:
        id: 15
        output_key: risk_mask
        description: Boundary risk or transition-zone decision-support prompt.
        label_source: derived_from_signal_uncertainty_and_review_context
      uncertain:
        id: 16
        output_key: uncertain_mask
        description: Low-confidence or quality-limited area.
        label_source: model_uncertainty_or_quality_rule
    medical_boundary: ICG and proxy fluorescence masks describe perfusion/activity cues and cannot be treated as jaw osteomyelitis-specific ground truth.
pipelines: [classification, segmentation, detection, quantification, multitask]
metrics: [accuracy, sensitivity, specificity, precision, f1, dice, iou, hd95]
demo_outputs:
  - prediction
  - probability
  - class_label
  - risk_level
  - segmentation_mask
  - lesion_evidence
  - quantification
  - warnings
  - report_path
benchmark_contract:
  manifest_version: v2
  patient_level_split_recommended: true
  threshold_analysis_required_when_labeled: true
  mask_path_column: mask_path
  submission_format: csv
  submission_columns: [case_id, prediction, probability, mask_path, report_path]
recommended_models:
  - model_id: convnext3d_d025_proxy_segmenter
    family: convnext3d_segmenter
    task_types: [segmentation]
    input_types: [npz_roi]
    priority: 9
  - model_id: fluorescence_hotspot_2d_segmenter
    family: fluorescence_hotspot_segmenter
    task_types: [segmentation]
    input_types: [2d_image]
    priority: 8
  - model_id: keyframe_residual_attention_unet_s20260715_20260715
    family: residual_attention_unet_keyframe_segmenter
    task_types: [segmentation]
    input_types: [2d_image]
    priority: 11
  - model_id: convnext2d_keyframe_proxy_segmenter
    family: convnext2d_keyframe_segmenter
    task_types: [segmentation]
    input_types: [2d_image]
    priority: 7
  - model_id: d025_lesion_smoke_segmenter
    family: d025_lesion_segmenter
    task_types: [segmentation]
    input_types: [npz_roi]
    priority: 10
  - model_id: nnunet_v2_osteo_baseline
    family: nnunet_v2
    task_types: [segmentation]
    input_types: [dicom_series, nifti_volume, npz_roi]
    priority: 1
  - model_id: medsam2_osteo_promptable
    family: medsam_like
    task_types: [segmentation]
    input_types: [2d_image, video_file, video_stream, npz_roi, dicom_series, nifti_volume]
    priority: 2
  - model_id: biomedclip_osteo_screening
    family: vlm_encoder
    task_types: [classification]
    input_types: [2d_image]
    priority: 3
  - model_id: fixture_default
    family: fixture
    task_types: ['*']
    input_types: ['*']
    priority: 99
safety:
  disclaimer_required: true
  clinical_claim_allowed: false
  user_upload_policy: transient_inference_only
  anonymize_logs: true
  intended_use: research platform software software for intraoperative decision support
