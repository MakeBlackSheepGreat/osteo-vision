capability: patient_conditioned_segmentation
promotion_policy_path: configs/training/three_priority_promotion.yml
seed: 20260718
device: cpu
image_shape: [64, 64]
batch_size: 4
max_train_batches: 8
learning_rate: 0.001
threshold: 0.5
threshold_candidates: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55]
model:
  base_channels: 8
  modulation_basis_count: 4
  clinical_hidden_channels: 16
  max_logit_delta: 0.75
  min_present_fraction: 0.75
clinical_features:
  names:
    - age_years
    - sex_at_birth_female
    - diabetes
    - hypertension
    - renal_disease
    - immunosuppression
    - antiresorptive_medication
    - wbc_10e9_l
    - neutrophil_percent
    - crp_mg_l
    - esr_mm_h
    - hemoglobin_g_l
  mean: [50.0, 0.5, 0.2, 0.3, 0.1, 0.1, 0.1, 7.0, 60.0, 10.0, 20.0, 130.0]
  scale: [20.0, 0.5, 0.4, 0.5, 0.3, 0.3, 0.3, 3.0, 15.0, 20.0, 25.0, 25.0]
proxy_smoke:
  group_counts:
    train: 6
    val: 2
    test: 2
  samples_per_group: 2
output:
  directory: artifacts/patient_conditioned_segmentation_proxy
